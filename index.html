<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberWallet - Quản Lý Chi Tiêu Công Nghệ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
        }
        /* Hiệu ứng kính mờ công nghệ */
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen pb-12 antialiased">

    <div class="max-w-2xl mx-auto px-4 pt-8">
        
        <!-- Header & Tổng số dư (Phong cách Cyberpunk / Fintech) -->
        <header class="glass-card p-6 rounded-3xl shadow-2xl relative overflow-hidden mb-6">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-semibold tracking-wider uppercase text-slate-400">Tổng tài sản hiện có</span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-cyan-400 rounded-full animate-pulse"></span> Live System
                </span>
            </div>
            <div id="totalBalance" class="text-4xl font-extrabold tracking-tight text-white mb-1">0 ₫</div>
        </header>

        <!-- Thêm giao dịch mới -->
        <section class="glass-card p-6 rounded-3xl shadow-xl mb-6">
            <h2 class="text-base font-bold mb-4 text-slate-200 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Thêm Giao Dịch Mới
            </h2>
            
            <form id="transactionForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Loại giao dịch</label>
                        <select id="type" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-white transition-all">
                            <option value="income">Thu tiền (+)</option>
                            <option value="expense">Chi tiền (-)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Số tiền (VNĐ)</label>
                        <input type="number" id="amount" placeholder="VD: 50000" required
                            class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-white transition-all placeholder:text-slate-600">
                    </div>
                </div>

                <!-- Phần Ngày thực hiện: Ngày -> Tháng -> Năm -->
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Ngày thực hiện (Ngày / Tháng / Năm)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <select id="inputDay" required class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none text-white font-medium">
                            <!-- Ngày -->
                        </select>
                        <select id="inputMonth" required class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none text-white font-medium">
                            <option value="01">Tháng 1</option>
                            <option value="02">Tháng 2</option>
                            <option value="03">Tháng 3</option>
                            <option value="04">Tháng 4</option>
                            <option value="05">Tháng 5</option>
                            <option value="06">Tháng 6</option>
                            <option value="07">Tháng 7</option>
                            <option value="08">Tháng 8</option>
                            <option value="09">Tháng 9</option>
                            <option value="10">Tháng 10</option>
                            <option value="11">Tháng 11</option>
                            <option value="12">Tháng 12</option>
                        </select>
                        <select id="inputYear" required class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none text-white font-medium">
                            <!-- Năm -->
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Ghi chú</label>
                    <input type="text" id="note" placeholder="VD: Ăn sáng, Lương..." required
                        class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-white transition-all placeholder:text-slate-600">
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-500/25 active:scale-[0.99]">
                    Lưu Giao Dịch
                </button>
            </form>
        </section>

        <!-- Lọc theo Tháng -->
        <section class="glass-card p-6 rounded-3xl shadow-xl mb-6">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b border-slate-800 pb-4 mb-4">
                <h2 class="text-base font-bold text-slate-200">Xem Theo Tháng</h2>
                
                <div class="flex items-center gap-2">
                    <select id="selectMonth" class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-medium text-white">
                        <option value="01">Tháng 1</option>
                        <option value="02">Tháng 2</option>
                        <option value="03">Tháng 3</option>
                        <option value="04">Tháng 4</option>
                        <option value="05">Tháng 5</option>
                        <option value="06">Tháng 6</option>
                        <option value="07">Tháng 7</option>
                        <option value="08">Tháng 8</option>
                        <option value="09">Tháng 9</option>
                        <option value="10">Tháng 10</option>
                        <option value="11">Tháng 11</option>
                        <option value="12">Tháng 12</option>
                    </select>

                    <select id="selectYear" class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-medium text-white">
                        <!-- Năm -->
                    </select>
                </div>
            </div>

            <!-- Tổng quan Thu / Chi trong tháng -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-emerald-950/30 border border-emerald-500/20 p-4 rounded-2xl">
                    <p class="text-[11px] font-semibold uppercase tracking-wider text-emerald-400 mb-1">Thu nhập tháng</p>
                    <p id="monthlyIncome" class="text-xl font-bold text-emerald-300">0 ₫</p>
                </div>
                <div class="bg-rose-950/30 border border-rose-500/20 p-4 rounded-2xl">
                    <p class="text-[11px] font-semibold uppercase tracking-wider text-rose-400 mb-1">Chi tiêu tháng</p>
                    <p id="monthlyExpense" class="text-xl font-bold text-rose-300">0 ₫</p>
                </div>
            </div>
        </section>

        <!-- Danh sách giao dịch -->
        <section class="glass-card p-6 rounded-3xl shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-200">Nhật Ký Giao Dịch</h2>
                <button onclick="resetHistory()" class="text-xs text-rose-400 hover:text-rose-300 font-medium transition-colors">Xóa sạch nhật ký</button>
            </div>
            <div id="transactionList" class="space-y-3">
                <!-- Danh sách giao dịch -->
            </div>
        </section>
    </div>

    <script>
        function getLocalTodayString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const todayDateString = getLocalTodayString();
        const lastActiveDate = localStorage.getItem('expense_last_date');
        
        let totalBalance = parseFloat(localStorage.getItem('expense_total_balance')) || 0;
        let transactions = JSON.parse(localStorage.getItem('expense_app_data')) || [];

        if (lastActiveDate && lastActiveDate !== todayDateString) {
            transactions = [];
            localStorage.setItem('expense_app_data', JSON.stringify(transactions));
        }
        localStorage.setItem('expense_last_date', todayDateString);

        const totalBalanceEl = document.getElementById('totalBalance');
        const monthlyIncomeEl = document.getElementById('monthlyIncome');
        const monthlyExpenseEl = document.getElementById('monthlyExpense');
        const transactionListEl = document.getElementById('transactionList');
        const form = document.getElementById('transactionForm');
        
        const inputDayEl = document.getElementById('inputDay');
        const inputMonthEl = document.getElementById('inputMonth');
        const inputYearEl = document.getElementById('inputYear');

        const selectMonthEl = document.getElementById('selectMonth');
        const selectYearEl = document.getElementById('selectYear');

        for (let d = 1; d <= 31; d++) {
            const option = document.createElement('option');
            option.value = String(d).padStart(2, '0');
            option.textContent = `Ngày ${d}`;
            inputDayEl.appendChild(option);
        }

        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 5; y++) {
            const opt1 = document.createElement('option');
            opt1.value = y;
            opt1.textContent = `Năm ${y}`;
            inputYearEl.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = y;
            opt2.textContent = `Năm ${y}`;
            if (y === currentYear) opt2.selected = true;
            selectYearEl.appendChild(opt2);
        }

        const today = new Date();
        inputDayEl.value = String(today.getDate()).padStart(2, '0');
        inputMonthEl.value = String(today.getMonth() + 1).padStart(2, '0');
        inputYearEl.value = today.getFullYear();
        selectMonthEl.value = String(today.getMonth() + 1).padStart(2, '0');

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        function formatDateVietnamese(dateString) {
            const [year, month, day] = dateString.split('-');
            return `Ngày ${parseInt(day, 10)} tháng ${parseInt(month, 10)}, ${year}`;
        }

        function saveData() {
            localStorage.setItem('expense_app_data', JSON.stringify(transactions));
            localStorage.setItem('expense_total_balance', totalBalance);
            localStorage.setItem('expense_last_date', todayDateString);
        }

        function render() {
            const selectedMonth = `${selectYearEl.value}-${selectMonthEl.value}`;

            let monthIncome = 0;
            let monthExpense = 0;

            transactionListEl.innerHTML = '';

            const filteredTransactions = transactions.filter(t => t.date.startsWith(selectedMonth));
            filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));

            filteredTransactions.forEach(t => {
                if (t.type === 'income') monthIncome += t.amount;
                else monthExpense += t.amount;
            });

            totalBalanceEl.textContent = formatCurrency(totalBalance);
            monthlyIncomeEl.textContent = formatCurrency(monthIncome);
            monthlyExpenseEl.textContent = formatCurrency(monthExpense);

            if (filteredTransactions.length === 0) {
                transactionListEl.innerHTML = `<p class="text-center text-slate-500 py-6 text-sm">Chưa có giao dịch nào trong tháng này.</p>`;
                return;
            }

            filteredTransactions.forEach(t => {
                const isIncome = t.type === 'income';
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-4 rounded-2xl border transition-all ${isIncome ? 'border-emerald-500/20 bg-emerald-950/10 hover:bg-emerald-950/20' : 'border-rose-500/20 bg-rose-950/10 hover:bg-rose-950/20'}`;
                
                item.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-semibold text-slate-100 text-sm mb-0.5">${t.note}</span>
                        <span class="text-xs text-slate-400 font-medium">${formatDateVietnamese(t.date)}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-sm ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
                            ${isIncome ? '+' : '-'}${formatCurrency(t.amount)}
                        </span>
                        <button onclick="deleteTransaction(${t.id})" 
                            title="Xóa giao dịch"
                            class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-colors">
                            ✕
                        </button>
                    </div>
                `;
                transactionListEl.appendChild(item);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const type = document.getElementById('type').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const d = inputDayEl.value;
            const m = inputMonthEl.value;
            const y = inputYearEl.value;
            const date = `${y}-${m}-${d}`;
            const note = document.getElementById('note').value.trim();

            const newTransaction = {
                id: Date.now(),
                type: type,
                amount: amount,
                date: date,
                note: note
            };

            if (type === 'income') {
                totalBalance += amount;
            } else {
                totalBalance -= amount;
            }

            transactions.push(newTransaction);
            saveData();
            
            selectYearEl.value = y;
            selectMonthEl.value = m;
            
            render();

            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
        });

        function deleteTransaction(id) {
            const index = transactions.findIndex(t => t.id === id);
            if (index !== -1) {
                const t = transactions[index];
                if (t.type === 'income') {
                    totalBalance -= t.amount;
                } else {
                    totalBalance += t.amount;
                }

                transactions.splice(index, 1);
                saveData();
                render();
            }
        }

        function resetHistory() {
            if (confirm('Bạn có chắc chắn muốn xóa toàn bộ nhật ký giao dịch không? (Số tiền tổng sẽ được giữ nguyên)')) {
                transactions = [];
                saveData();
                render();
            }
        }

        selectMonthEl.addEventListener('change', render);
        selectYearEl.addEventListener('change', render);

        render();
    </script>
</body>
</html>
